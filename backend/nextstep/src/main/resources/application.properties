spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cors.allowed-origins=http://localhost:3000

app.github.api-url=https://api.github.com

app.apify.api-url=https://api.apify.com
app.apify.token=${APIFY_TOKEN:disabled}

app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.5-flash

spring.mail.host=localhost
spring.mail.port=2520
spring.mail.username=local@nextstep.dev
spring.mail.password=local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
